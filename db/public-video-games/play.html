<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Play — Public Video Games Database</title>
<meta name="description" content="Play public-domain and openly-licensed video games right in the browser. Keyboard, numpad, and touch controls. Property of Justin Addam Higgins.">
<style>
:root{--bg:#070b16;--panel:#0d1526;--line:#1d2c4d;--ink:#e8f1ff;--dim:#9fb3d8;--acc:#2f7bff;--ok:#00e5a0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.topbar a{color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.topbar h1{margin:0;font-size:1.2em;flex:1}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
canvas{display:block;width:100%;height:auto;border-radius:8px;touch-action:none;background:#070b16}
.help{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;font-size:.92em;color:var(--dim)}
.help b{color:var(--ink)}
.pvg-pad{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
.pvg-dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:2px}
.pvg-dpad button{grid-column:2;background:#14305e;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:1.3em;touch-action:none;user-select:none;-webkit-user-select:none}
.pvg-dpad button[data-k="up"]{grid-row:1;grid-column:2}
.pvg-dpad button[data-k="left"]{grid-row:2;grid-column:1}
.pvg-dpad button[data-k="right"]{grid-row:2;grid-column:3}
.pvg-dpad button[data-k="down"]{grid-row:3;grid-column:2}
.pvg-ab{display:flex;gap:10px}
.pvg-ab button{min-width:72px;min-height:72px;border-radius:50%;background:#14305e;border:2px solid var(--acc);color:var(--ink);font-weight:bold;font-size:.95em;touch-action:none;user-select:none;-webkit-user-select:none}
.pvg-pad button.on{background:var(--acc)}
.foot{margin-top:18px;padding-top:10px;border-top:1px solid var(--line);color:var(--dim);font-size:.82em}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="index.html">← Archive</a>
    <h1 id="gtitle">Loading game…</h1>
  </div>
  <div class="stage" id="stage">
    <canvas id="game"></canvas>
  </div>
  <div class="help" id="ghelp"></div>
  <div class="foot">✳ Public Video Games Database — openly licensed games, playable here. Property of Justin Addam Higgins (JAH).</div>
</div>
<script src="games/engine.js"></script>
<script>
(function(){
  var q = {};
  location.search.replace(/^\?/,'').split('&').forEach(function(p){
    var kv = p.split('='); if(kv[0]) q[kv[0]] = decodeURIComponent(kv[1]||'');
  });
  var slug = (q.game||'').replace(/[^a-z0-9]/g,'');
  var files = {snake:1,pong:1,breakout:1,invaders:1,blocks:1,minesweeper:1,'2048':1,flier:1,sokoban:1,asteroids:1,hopper:1,simon:1};
  if(!files[slug]) slug = 'snake';
  var s = document.createElement('script');
  s.src = 'games/' + (slug==='2048' ? 'n2048' : slug) + '.js';
  s.onload = function(){
    var api = PVG.play('game', slug);
    if(!api){ document.getElementById('gtitle').textContent = 'Game not found'; return; }
    var def = null;
    try { def = null; } catch(e){}
    document.getElementById('gtitle').textContent = gameTitle(slug);
    document.getElementById('ghelp').innerHTML = '<b>How to play:</b> ' + esc(gameHelp(slug))
      + '<br><b>PC:</b> keyboard — arrows / WASD / numpad (2468 move, 5 action). <b>Phone:</b> on-screen pad, tap, swipe, or drag — whichever the game uses.';
  };
  document.head.appendChild(s);
  var TITLES = {snake:'Snake',pong:'Pong',breakout:'Breakout',invaders:'Invaders',blocks:'Blocks',minesweeper:'Minesweeper','2048':'2048',flier:'Flier',sokoban:'Sokoban',asteroids:'Asteroids',hopper:'Hopper',simon:'Simon'};
  var HELPS = {
    snake:'Eat the red apples to grow. Do not hit walls or yourself.',
    pong:'First to 7 wins. Move your paddle up/down.',
    breakout:'Clear every brick. Do not drop the ball.',
    invaders:'Destroy the invasion before it lands. Shields protect you.',
    blocks:'Complete horizontal lines to clear them.',
    minesweeper:'Reveal safe squares. Flag the mines. Use DIG/FLAG mode.',
    '2048':'Slide and merge matching tiles. Reach 2048.',
    flier:'Flap through the pipes. One hit ends the run.',
    sokoban:'Push every crate onto a glowing target.',
    asteroids:'Blast every rock. Big rocks split.',
    hopper:'Cross the road, ride the logs, fill all 5 homes.',
    simon:'Watch the flashing sequence, then repeat it exactly.'
  };
  function gameTitle(s){ return TITLES[s]||s; }
  function gameHelp(s){ return HELPS[s]||''; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
})();
</script>
</body>
</html>
