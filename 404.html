<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combo Router — Signature Word Combos</title>
<style>body{font-family:Georgia,serif;max-width:760px;margin:0 auto;padding:1em;line-height:1.55;color:#1a1a1a;background:#fff}h1{font-size:1.6em}footer{border-top:2px solid #333;margin-top:2em;padding-top:.8em;font-size:.9em}</style>
</head>
<body>
<div id="combo-root">
<h1>Combo Router</h1>
<p>Loading this combo's page…</p>
<noscript>
<p>This address is a word-combo page, and combo pages are built in your browser. With JavaScript off, this page cannot be built here. The 103 stored combo pages and the Router's own accessible version work without JavaScript:</p>
<p><a href="https://justinahiggins614-cmyk.github.io/jah-databases/combos/">Combo Router</a> · <a href="https://justinahiggins614-cmyk.github.io/jah-databases/combos/accessible/index.html">Combo Router (accessible version)</a></p>
<p>Stored combo pages live at combos/&lt;combo-slug&gt;/ — for example combos/joke-generator/.</p>
</noscript>
</div>
<script>
(function () {
  var path = window.location.pathname;
  var rootEl = document.getElementById("combo-root");
  var i = path.indexOf("/combos/");
  if (i < 0) {
    /* Not a combo URL at all: plain not-found page. No combo is rendered.
     * Site root is the first path segment (the project-pages base). */
    var seg = path.split("/")[1] || "";
    var r = seg ? "/" + seg : "";
    rootEl.innerHTML = "<h1>Page not found</h1><p>There is no page at this address. "
      + "For word combos, start at the <a href=\"" + r + "/combos/\">Combo Router</a>, "
      + "or go to <a href=\"" + r + "/\">The 'Merica-L Boundless Ecosystem OS</a>.</p>";
    return;
  }
  var root = path.slice(0, i);
  var s = document.createElement("script");
  s.src = root + "/combos/combo-page.js";
  s.onload = function () { window.ComboPage.renderFromLocation(document); };
  s.onerror = function () {
    rootEl.innerHTML = "<h1>Combo Router</h1><p>This combo page could not be loaded (combos/combo-page.js did not load). "
      + "Try the <a href=\"" + root + "/combos/\">Combo Router</a>.</p>";
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
